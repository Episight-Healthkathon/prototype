[project]
name = "episight-api"
version = "0.1.0"
description = "EPISIGHT backend: screening, episode reconstruction, evidence-gap investigation, reviewer brief."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "anthropic>=1.11.0",
    "openai>=3.23.0",
]

[project.scripts]
episight = "episight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/episight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: requires the PostgreSQL test database (docker compose up -d)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Synthetic note text and autogenerated migrations are long by nature.
"tests/fixtures/*.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]
"src/episight/devtools/contract_export.py" = ["E501"]  # scripted fixture data
# typer.Option(...) defaults are the library's documented pattern.
"src/episight/cli.py" = ["B008"]
