# Local development database for EPISIGHT.
# Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: episight
      POSTGRES_PASSWORD: episight
      POSTGRES_DB: episight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episight -d episight"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
